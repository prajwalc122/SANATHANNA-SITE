<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="vBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F7FF"/>
      <stop offset="100%" stop-color="#E3EFFF"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#vBg)"/>

  <!-- Top Banner -->
  <rect x="20" y="15" width="620" height="45" rx="8" fill="url(#headerGrad)"/>
  <text x="330" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    Vastu House Plan with Measurements
  </text>
  <text x="330" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#1E3A8A" text-anchor="middle">
    (All measurements in Feet • 40 ft × 30 ft)
  </text>

  <!-- Compass Rose -->
  <g transform="translate(710, 70)">
    <circle cx="0" cy="0" r="38" fill="#FFFFFF" stroke="#1565C0" stroke-width="2.5"/>
    <!-- North Arrow -->
    <polygon points="0,-34 -7,-6 7,-6" fill="#D32F2F"/>
    <polygon points="0,34 -7,6 7,6" fill="#1565C0"/>
    <polygon points="-34,0 -6,-7 -6,7" fill="#1565C0"/>
    <polygon points="34,0 6,-7 6,7" fill="#1565C0"/>
    <text x="0" y="-42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#D32F2F" text-anchor="middle">N</text>
    <text x="0" y="54" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1565C0" text-anchor="middle">S</text>
    <text x="-48" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1565C0" text-anchor="middle">W</text>
    <text x="48" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1565C0" text-anchor="middle">E</text>
  </g>

  <!-- Outer Floorplan Walls -->
  <rect x="50" y="110" width="460" height="360" fill="#FFFFFF" stroke="#263238" stroke-width="6" rx="4"/>

  <!-- Internal Rooms -->
  <!-- Bedroom 2 (NW) -->
  <rect x="50" y="110" width="130" height="120" fill="#FFF3E0" stroke="#37474F" stroke-width="3"/>
  <text x="115" y="160" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3E2723" text-anchor="middle">Bedroom 2</text>
  <text x="115" y="180" font-family="sans-serif" font-size="11" fill="#5D4037" text-anchor="middle">10&apos; × 12&apos;</text>

  <!-- Toilet 1 (North) -->
  <rect x="180" y="110" width="70" height="80" fill="#E1F5FE" stroke="#37474F" stroke-width="3"/>
  <text x="215" y="150" font-family="sans-serif" font-size="11" font-weight="bold" fill="#01579B" text-anchor="middle">Toilet</text>
  <text x="215" y="165" font-family="sans-serif" font-size="9" fill="#0277BD" text-anchor="middle">5&apos; × 8&apos;</text>

  <!-- Kitchen (NE - Agneya/Ishanya Vastu Alignment) -->
  <rect x="250" y="110" width="130" height="120" fill="#FFF8E1" stroke="#37474F" stroke-width="3"/>
  <text x="315" y="160" font-family="sans-serif" font-size="13" font-weight="bold" fill="#E65100" text-anchor="middle">Kitchen</text>
  <text x="315" y="180" font-family="sans-serif" font-size="11" fill="#F57F17" text-anchor="middle">10&apos; × 12&apos;</text>

  <!-- Puja Room (East-North East Ishanya) -->
  <rect x="380" y="110" width="130" height="120" fill="#FBE9E7" stroke="#37474F" stroke-width="3"/>
  <circle cx="445" cy="145" r="16" fill="#FF6F00"/>
  <text x="445" y="151" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">🛕</text>
  <text x="445" y="180" font-family="sans-serif" font-size="13" font-weight="bold" fill="#BF360C" text-anchor="middle">Puja Room</text>
  <text x="445" y="198" font-family="sans-serif" font-size="11" fill="#D84315" text-anchor="middle">6&apos; × 6&apos; (Ishanya)</text>

  <!-- Living & Dining (Brahmasthan Central Space) -->
  <rect x="180" y="190" width="200" height="160" fill="#FFFDE7" stroke="#37474F" stroke-width="3"/>
  <text x="280" y="260" font-family="sans-serif" font-size="14" font-weight="bold" fill="#827717" text-anchor="middle">Living &amp; Dining</text>
  <text x="280" y="280" font-family="sans-serif" font-size="12" fill="#9E9D24" text-anchor="middle">16&apos; × 14&apos; (Brahmasthan)</text>

  <!-- Toilet Common -->
  <rect x="380" y="230" width="65" height="90" fill="#E1F5FE" stroke="#37474F" stroke-width="3"/>
  <text x="412" y="275" font-family="sans-serif" font-size="10" font-weight="bold" fill="#01579B" text-anchor="middle">Toilet</text>

  <!-- Bedroom 3 -->
  <rect x="380" y="320" width="130" height="150" fill="#FFF3E0" stroke="#37474F" stroke-width="3"/>
  <text x="445" y="390" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3E2723" text-anchor="middle">Bedroom 3</text>
  <text x="445" y="410" font-family="sans-serif" font-size="11" fill="#5D4037" text-anchor="middle">10&apos; × 12&apos;</text>

  <!-- Master Bedroom 1 (SW - Nairutya) -->
  <rect x="50" y="230" width="130" height="240" fill="#FFE0B2" stroke="#37474F" stroke-width="3"/>
  <text x="115" y="340" font-family="sans-serif" font-size="13" font-weight="bold" fill="#E65100" text-anchor="middle">Bedroom 1</text>
  <text x="115" y="360" font-family="sans-serif" font-size="11" fill="#BF360C" text-anchor="middle">12&apos; × 14&apos;</text>
  <text x="115" y="380" font-family="sans-serif" font-size="10" font-weight="bold" fill="#D84315" text-anchor="middle">(Nairutya / SW)</text>

  <!-- Main Entrance Door (East) -->
  <rect x="220" y="440" width="80" height="30" fill="#C8E6C9" stroke="#2E7D32" stroke-width="3"/>
  <text x="260" y="460" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1B5E20" text-anchor="middle">Main Door (East)</text>

  <!-- Right Side Guidelines Box -->
  <g transform="translate(530, 130)">
    <rect width="245" height="340" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
    <rect width="245" height="36" rx="6" fill="#2E7D32"/>
    <text x="122" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      Vastu Guidelines Checklist
    </text>

    <text x="12" y="65" font-family="sans-serif" font-size="11" fill="#1B5E20" font-weight="bold">✓ Main door - East (Auspicious)</text>
    <text x="12" y="100" font-family="sans-serif" font-size="11" fill="#1B5E20" font-weight="bold">✓ Puja room - North East (Best)</text>
    <text x="12" y="135" font-family="sans-serif" font-size="11" fill="#1B5E20" font-weight="bold">✓ Kitchen - South East (Ideal)</text>
    <text x="12" y="170" font-family="sans-serif" font-size="11" fill="#1B5E20" font-weight="bold">✓ Master bed - South West (Good)</text>
    <text x="12" y="205" font-family="sans-serif" font-size="11" fill="#1B5E20" font-weight="bold">✓ Children bed - West / NW</text>
    <text x="12" y="240" font-family="sans-serif" font-size="11" fill="#1B5E20" font-weight="bold">✓ Center (Brahmasthan) open</text>
    
    <rect x="10" y="270" width="225" height="55" rx="6" fill="#E8F5E9" stroke="#81C784"/>
    <text x="122" y="293" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2E7D32" text-anchor="middle">
      Follow Vastu for Peace, Health,
    </text>
    <text x="122" y="311" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1B5E20" text-anchor="middle">
      Wealth &amp; Prosperity
    </text>
  </g>

  <!-- Bottom Coordinates Labels -->
  <text x="50" y="495" font-family="sans-serif" font-size="11" font-weight="bold" fill="#C62828">South West (Nairutya)</text>
  <text x="260" y="505" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1565C0" text-anchor="middle">↓ South</text>
  <text x="440" y="495" font-family="sans-serif" font-size="11" font-weight="bold" fill="#EF6C00">South East (Agneya)</text>

  <text x="50" y="102" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1565C0">North West (Vayavya)</text>
  <text x="260" y="102" font-family="sans-serif" font-size="12" font-weight="bold" fill="#D32F2F" text-anchor="middle">↑ North</text>
  <text x="440" y="102" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">North East (Ishanya)</text>
</svg>