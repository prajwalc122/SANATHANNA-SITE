<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="35%" stop-color="#FF9933" />
      <stop offset="70%" stop-color="#D9480F" />
      <stop offset="100%" stop-color="#6B1D00" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="25%" stop-color="#FDCB6E" />
      <stop offset="50%" stop-color="#D49A1B" />
      <stop offset="75%" stop-color="#FFF3CD" />
      <stop offset="100%" stop-color="#B7791F" />
    </linearGradient>

    <linearGradient id="deepGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B341E" />
      <stop offset="50%" stop-color="#DD6B20" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>

    <!-- Divine Halo Glow -->
    <filter id="divineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3D1200" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Protective Medallion Background -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGlow)" />
  
  <!-- Outer Ornate Beaded Rim -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="7 5" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8" />

  <!-- Radiating Sun Rays (Surya Mandala) -->
  <g opacity="0.22" stroke="#FFF7ED" stroke-width="2">
    <line x1="256" y1="26" x2="256" y2="226" />
    <line x1="256" y1="286" x2="256" y2="486" />
    <line x1="26" y1="256" x2="226" y2="256" />
    <line x1="286" y1="256" x2="486" y2="256" />
    <line x1="93" y1="93" x2="234" y2="234" />
    <line x1="278" y1="278" x2="419" y2="419" />
    <line x1="93" y1="419" x2="234" y2="278" />
    <line x1="278" y1="234" x2="419" y2="93" />
    <line x1="40" y1="170" x2="472" y2="342" />
    <line x1="40" y1="342" x2="472" y2="170" />
    <line x1="170" y1="40" x2="342" y2="472" />
    <line x1="342" y1="40" x2="170" y2="472" />
  </g>

  <!-- Sacred Inner Lotus Pedestal (Padma) -->
  <g fill="url(#goldGrad)" opacity="0.85" filter="url(#softShadow)">
    <!-- Base Lotus Petals -->
    <path d="M 256 460 C 230 435, 170 410, 150 435 C 130 460, 210 470, 256 470 C 302 470, 382 460, 362 435 C 342 410, 282 435, 256 460 Z" />
    <path d="M 256 450 C 210 415, 120 400, 110 425 C 100 450, 200 460, 256 460 C 312 460, 412 450, 402 425 C 392 400, 302 415, 256 450 Z" opacity="0.6" />
  </g>

  <!-- Central Divine Kalasha & Ganesha Aura (Golden Medallion Ring) -->
  <circle cx="256" cy="240" r="176" fill="#501502" opacity="0.45" />
  <circle cx="256" cy="240" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Sacred Kalasha (Poornakumbha) Base Base Silhouette -->
  <g filter="url(#softShadow)" fill="url(#goldGrad)">
    <!-- Kalasha Pot Base -->
    <path d="M 216 410 L 296 410 C 310 410, 320 395, 310 380 L 296 360 L 216 360 L 202 380 C 192 395, 202 410, 216 410 Z" opacity="0.9" />
  </g>

  <!-- Lord Ganesha & Sacred Aum (Devanagari / Vedic Form) Master Silhouette -->
  <g filter="url(#divineGlow)" fill="url(#goldGrad)">
    <!-- Ganesha Mukuta (Divine Crown) -->
    <path d="M 256 68 L 268 98 L 284 92 L 274 122 L 292 128 L 272 154 L 282 168 L 256 182 L 230 168 L 240 154 L 220 128 L 238 122 L 228 92 L 244 98 Z" />
    
    <!-- Crown Jewel & Tilak / Trishula (Tripundra & Tilaka) -->
    <path d="M 256 94 L 261 106 L 256 116 L 251 106 Z" fill="#FFF5EB" />
    <path d="M 247 142 Q 256 138 265 142 L 265 146 Q 256 142 247 146 Z" fill="#FF3300" />
    <path d="M 245 150 Q 256 146 267 150 L 267 154 Q 256 150 245 154 Z" fill="#FF3300" />
    <circle cx="256" cy="162" r="4.5" fill="#FF3300" />

    <!-- Big Majestic Right Ear (Supakarna) -->
    <path d="M 226 172 C 180 160, 140 190, 150 236 C 158 270, 196 280, 224 266 C 220 240, 222 205, 226 172 Z" />
    
    <!-- Left Ear (Supakarna) -->
    <path d="M 286 172 C 332 160, 372 190, 362 236 C 354 270, 316 280, 288 266 C 292 240, 290 205, 286 172 Z" />

    <!-- Majestic Ganesha Head & Temples (Kumbha) -->
    <path d="M 224 176 C 220 216, 230 240, 240 256 C 248 246, 264 246, 272 256 C 282 240, 292 216, 288 176 C 274 186, 238 186, 224 176 Z" />

    <!-- Auspicious Right-Turned Trunk (Valampuri Vakratunda / Sacred Curve) -->
    <!-- Creating an authentic calligraphy of Om integrated inside Ganesha Trunk -->
    <path d="M 244 246 C 242 280, 248 316, 262 338 C 274 356, 296 364, 314 350 C 328 338, 326 314, 310 306 C 294 298, 282 306, 282 316 C 282 322, 288 326, 294 324 C 298 322, 298 316, 292 314 C 284 316, 288 328, 298 332 C 308 336, 314 326, 308 314 C 298 296, 272 296, 264 272 C 258 254, 258 238, 258 226 Z" />

    <!-- Single Auspicious Tusk (Ekadanta) on Left, Broken Tusk on Right -->
    <path d="M 276 260 L 294 272 L 276 270 Z" fill="#FFFFFF" />
    <path d="M 236 260 L 226 266 L 234 268 Z" fill="#FFFFFF" />

    <!-- Modaka (Sweet offering) held in Trunk Hand -->
    <ellipse cx="320" cy="300" rx="9" ry="11" fill="#FFEAA7" />
    <path d="M 314 300 Q 320 290 326 300 Z" fill="#FDCB6E" />

    <!-- Abhaya Mudra Blessing Hand (Right) -->
    <path d="M 172 284 C 160 300, 162 334, 186 348 C 204 358, 222 344, 218 328 C 214 312, 196 304, 192 286 Z" />
    <!-- Sacred Swastika / Red Dot on Palm -->
    <circle cx="190" cy="324" r="5" fill="#D9480F" />

    <!-- Modaka Patra / Bowl on Left -->
    <path d="M 334 320 C 330 340, 316 352, 296 358 C 308 368, 336 366, 350 346 C 356 336, 348 322, 334 320 Z" />
  </g>

  <!-- Sacred Vedic Om (ॐ) Center Medallion Emblem -->
  <g fill="url(#goldGrad)" filter="url(#softShadow)">
    <!-- Small Om emblem at top center -->
    <text x="256" y="58" font-family="'Noto Sans Kannada', 'Cormorant Garamond', serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#FFEAA7">ॐ</text>
  </g>

  <!-- Kannada Subtitle Ring Inscription (ಪೂಜಾ ಸೇವೆ • ಭಕ್ತಿ • ಶ್ರದ್ಧೆ) -->
  <!-- Top Arch Arc -->
  <path id="textArcTop" d="M 70 256 A 186 186 0 0 1 442 256" fill="none" stroke="none" />
  <path id="textArcBottom" d="M 442 256 A 186 186 0 0 1 70 256" fill="none" stroke="none" />
  
  <text fill="#FFEAA7" font-size="16" font-family="'Noto Sans Kannada', sans-serif" font-weight="700" letter-spacing="3" opacity="0.95">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ಸನಾತನ • SANAATANA
    </textPath>
  </text>

  <!-- Inner Sparkle Stars (4 corners) -->
  <g fill="#FFF3CD">
    <polygon points="76,256 82,250 88,256 82,262" />
    <polygon points="436,256 442,250 448,256 442,262" />
    <polygon points="256,76 262,70 268,76 262,82" />
    <polygon points="256,436 262,430 268,436 262,442" />
  </g>

  <!-- Final Radiant Border Ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
</svg>
