    <script>
      // Gracefully prevent unhandled WebSocket rejection messages from Vite dev-server HMR in iframe
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        if (
          reason &&
          ((typeof reason === 'string' && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1)) ||
           (reason.message && (reason.message.indexOf('WebSocket') !== -1 || reason.message.indexOf('websocket') !== -1)) ||
           reason.code === 1006)
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        if (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('websocket') !== -1)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });

      // Domain & HTTPS canonical redirect for pavitram.com
      (function () {
        try {
          var h = window.location.hostname;
          var p = window.location.protocol;
          if (h && (h === 'www.pavitram.com' || (h === 'pavitram.com' && p === 'http:'))) {
            window.location.replace('https://pavitram.com' + window.location.pathname + window.location.search + window.location.hash);
          }
        } catch (e) {}
      })();
    </script>
